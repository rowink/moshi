# Minimal Netlify config for moshi

[build]
  command = "pnpm build"
  publish = "dist"
  functions = "services/serverless-functions"

# Redirect the status-check endpoint to the serverless function
[[redirects]]
  from = "/status-check"
  to = "/.netlify/functions/cloud-status-check"
  status = 301
  force = true

# For router history mode, ensure all paths land on index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200